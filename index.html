<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Vy Nails & Hair Color Finder</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #f5f6f8;
            color: #1f2937;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            background: #901616;
            color: white;
            padding: 18px 24px;
        }

        .header-inner {
            max-width: 1200px;
            margin: 0 auto;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;
        }

        .brand {
            font-size: 22px;
            font-weight: 700;
        }

        .brand-subtitle {
            font-size: 13px;
            opacity: 0.8;
            margin-top: 3px;
        }

        /* =========================
           MAIN
        ========================= */

        main {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 16px;
            margin-bottom: 20px;
        }

        .search-box {
            flex: 1;
            position: relative;
        }

        .search-box input {
            width: 100%;

            padding: 13px 16px;

            border: 1px solid #d1d5db;
            border-radius: 9px;

            background: white;

            font-size: 15px;

            outline: none;
        }

        .search-box input:focus {
            border-color: #901616;
            box-shadow:
                0 0 0 3px rgba(144, 22, 22, 0.1);
        }

        .add-button {
            border: none;
            border-radius: 9px;

            padding: 13px 20px;

            background: #901616;
            color: white;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;

            transition: 0.15s;
        }

        .add-button:hover {
            background: #741212;
        }

        /* =========================
           TABLE
        ========================= */

        .table-card {
            background: white;

            border: 1px solid #e5e7eb;
            border-radius: 12px;

            overflow: hidden;
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 18px 20px;

            border-bottom: 1px solid #e5e7eb;
        }

        .table-title {
            font-size: 18px;
            font-weight: 700;
        }

        .result-count {
            font-size: 13px;
            color: #6b7280;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }

        th {
            text-align: left;

            padding: 13px 20px;

            background: #f9fafb;

            color: #6b7280;

            font-size: 12px;
            font-weight: 700;

            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        td {
            padding: 16px 20px;

            border-top: 1px solid #f0f0f0;

            font-size: 14px;
        }

        tbody tr:hover {
            background: #fafafa;
        }

        .table-number {
            width: 70px;
            color: #9ca3af;
        }

        .table-name {
            font-weight: 600;
        }

        .table-code {
            font-family:
                "SFMono-Regular",
                Consolas,
                "Liberation Mono",
                monospace;

            font-size: 13px;
            color: #4b5563;
        }

        .table-actions {
            display: flex;
            gap: 8px;
        }

        .table-btn {
            border: 1px solid #d1d5db;

            background: white;

            padding: 7px 12px;

            border-radius: 7px;

            font-size: 13px;

            cursor: pointer;
        }

        .table-btn.edit:hover {
            background: #f3f4f6;
        }

        .table-btn.delete {
            color: #b91c1c;
            border-color: #fecaca;
        }

        .table-btn.delete:hover {
            background: #fef2f2;
        }

        .empty {
            text-align: center;

            padding: 50px 20px;

            color: #9ca3af;
        }

        /* =========================
           MODAL
        ========================= */

        .modal-overlay {
            position: fixed;
            inset: 0;

            background: rgba(0, 0, 0, 0.45);

            display: none;

            align-items: center;
            justify-content: center;

            padding: 20px;

            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            width: 100%;
            max-width: 480px;

            background: white;

            border-radius: 14px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.2);

            overflow: hidden;
        }

        .modal-header {
            padding: 20px 22px;

            border-bottom: 1px solid #e5e7eb;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            margin: 0;

            font-size: 19px;
            font-weight: 700;
        }

        .close-button {
            border: none;
            background: transparent;

            font-size: 24px;

            color: #6b7280;

            cursor: pointer;
        }

        .modal-body {
            padding: 22px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-size: 13px;
            font-weight: 600;

            color: #374151;
        }

        input[type="text"] {
            width: 100%;

            padding: 12px 13px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            font-size: 15px;

            outline: none;
        }

        input[type="text"]:focus {
            border-color: #901616;

            box-shadow:
                0 0 0 3px rgba(144, 22, 22, 0.1);
        }

        .modal-footer {
            padding: 16px 22px;

            border-top: 1px solid #e5e7eb;

            display: flex;
            justify-content: flex-end;

            gap: 10px;
        }

        .cancel-button {
            border: 1px solid #d1d5db;

            background: white;

            padding: 10px 17px;

            border-radius: 8px;

            cursor: pointer;
        }

        .save-button {
            border: none;

            background: #901616;
            color: white;

            padding: 10px 19px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: 600;
        }

        .save-button:hover {
            background: #741212;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 650px) {
            header {
                padding: 16px;
            }

            .header-inner {
                align-items: flex-start;
            }

            .brand {
                font-size: 19px;
            }

            main {
                margin: 25px auto;
                padding: 0 12px;
            }

            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .add-button {
                width: 100%;
            }

            .table-header {
                padding: 15px;
            }

            th,
            td {
                padding-left: 14px;
                padding-right: 14px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="header-inner">
        <div>
            <div class="brand">
                Vy Nails & Hair Color Finder
            </div>

            <div class="brand-subtitle">
                Color name & custom code management
            </div>
        </div>
    </div>
</header>

<main>

    <div class="toolbar">

        <div class="search-box">
            <input
                id="search"
                type="text"
                placeholder="Search color name..."
                autocomplete="off"
            >
        </div>

        <button
            class="add-button"
            onclick="openAddModal()"
        >
            + Add Color
        </button>

    </div>

    <div class="table-card">

        <div class="table-header">

            <div class="table-title">
                Colors
            </div>

            <div
                id="resultCount"
                class="result-count"
            >
                0 colors
            </div>

        </div>

        <div class="table-wrapper">

            <table>

                <thead>
                    <tr>
                        <th>#</th>
                        <th>Color Name</th>
                        <th>Color Code</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="colorTableBody">
                </tbody>

            </table>

        </div>

    </div>

</main>

<!-- =========================
     MODAL
========================= -->

<div
    id="modalOverlay"
    class="modal-overlay"
>

    <div class="modal">

        <div class="modal-header">

            <h2
                id="modalTitle"
                class="modal-title"
            >
                Add Color
            </h2>

            <button
                class="close-button"
                onclick="closeModal()"
            >
                ×
            </button>

        </div>

        <div class="modal-body">

            <div class="form-group">

                <label for="nameInput">
                    Color Name
                </label>

                <input
                    id="nameInput"
                    type="text"
                    placeholder="e.g. Ocean Blue"
                >

            </div>

            <div class="form-group">

                <label for="codeInput">
                    Color Code
                </label>

                <input
                    id="codeInput"
                    type="text"
                    placeholder="e.g. OB-001"
                >

            </div>

        </div>

        <div class="modal-footer">

            <button
                class="cancel-button"
                onclick="closeModal()"
            >
                Cancel
            </button>

            <button
                class="save-button"
                onclick="saveColor()"
            >
                Save
            </button>

        </div>

    </div>

</div>

<script>

let colors = [];
let editingId = null;


/* =========================
   LOAD COLORS
========================= */

async function loadColors() {

    try {

        const response =
            await fetch("/api/colors");

        const result =
            await response.json();

        if (!response.ok) {
            throw new Error(
                result.error ||
                "Could not load colors."
            );
        }

        colors = result;

        render();

    } catch (error) {

        console.error(error);

        alert(
            "Could not load colors: " +
            error.message
        );
    }
}


/* =========================
   SEARCH
========================= */

function getFilteredColors() {

    const search =
        document
            .getElementById("search")
            .value
            .trim()
            .toLowerCase();

    return colors.filter(color =>
        String(color.name)
            .toLowerCase()
            .includes(search)
    );
}


/* =========================
   RENDER
========================= */

function render() {

    const filtered =
        getFilteredColors();

    const tbody =
        document.getElementById(
            "colorTableBody"
        );

    const resultCount =
        document.getElementById(
            "resultCount"
        );

    resultCount.textContent =
        `${filtered.length} ${
            filtered.length === 1
                ? "color"
                : "colors"
        }`;

    if (filtered.length === 0) {

        tbody.innerHTML = `
            <tr>
                <td
                    colspan="4"
                    class="empty"
                >
                    No colors found.
                </td>
            </tr>
        `;

        return;
    }

    tbody.innerHTML =
        filtered.map(
            (color, index) => `
                <tr>

                    <td class="table-number">
                        ${index + 1}
                    </td>

                    <td class="table-name">
                        ${escapeHtml(color.name)}
                    </td>

                    <td class="table-code">
                        ${escapeHtml(color.code)}
                    </td>

                    <td>

                        <div class="table-actions">

                            <button
                                class="table-btn edit"
                                onclick="editColor(${color.id})"
                            >
                                Edit
                            </button>

                            <button
                                class="table-btn delete"
                                onclick="deleteColor(${color.id})"
                            >
                                Delete
                            </button>

                        </div>

                    </td>

                </tr>
            `
        ).join("");
}


/* =========================
   SEARCH EVENT
========================= */

document
    .getElementById("search")
    .addEventListener(
        "input",
        render
    );


/* =========================
   ADD MODAL
========================= */

function openAddModal() {

    editingId = null;

    document.getElementById(
        "modalTitle"
    ).textContent = "Add Color";

    document.getElementById(
        "nameInput"
    ).value = "";

    document.getElementById(
        "codeInput"
    ).value = "";

    document
        .getElementById("modalOverlay")
        .classList.add("active");

    document
        .getElementById("nameInput")
        .focus();
}


/* =========================
   EDIT
========================= */

function editColor(id) {

    const color =
        colors.find(
            item =>
                Number(item.id) ===
                Number(id)
        );

    if (!color) {
        return;
    }

    editingId = Number(id);

    document.getElementById(
        "modalTitle"
    ).textContent = "Edit Color";

    document.getElementById(
        "nameInput"
    ).value = color.name;

    document.getElementById(
        "codeInput"
    ).value = color.code;

    document
        .getElementById("modalOverlay")
        .classList.add("active");
}


/* =========================
   SAVE
========================= */

async function saveColor() {

    const name =
        document
            .getElementById("nameInput")
            .value
            .trim();

    const code =
        document
            .getElementById("codeInput")
            .value
            .trim();

    if (!name) {

        alert(
            "Please enter a color name."
        );

        return;
    }

    if (!code) {

        alert(
            "Please enter a color code."
        );

        return;
    }

    try {

        const method =
            editingId === null
                ? "POST"
                : "PUT";

        const body =
            editingId === null
                ? {
                    name,
                    code
                }
                : {
                    id: editingId,
                    name,
                    code
                };

        const response =
            await fetch(
                "/api/colors",
                {
                    method,

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(body)
                }
            );

        const result =
            await response.json();

        if (!response.ok) {

            throw new Error(
                result.error ||
                "Could not save color."
            );
        }

        closeModal();

        await loadColors();

    } catch (error) {

        console.error(error);

        alert(error.message);
    }
}


/* =========================
   DELETE
========================= */

async function deleteColor(id) {

    const color =
        colors.find(
            item =>
                Number(item.id) ===
                Number(id)
        );

    if (!color) {
        return;
    }

    const confirmed =
        confirm(
            `Delete "${color.name}"?`
        );

    if (!confirmed) {
        return;
    }

    try {

        const response =
            await fetch(
                `/api/colors?id=${id}`,
                {
                    method: "DELETE"
                }
            );

        const result =
            await response.json();

        if (!response.ok) {

            throw new Error(
                result.error ||
                "Could not delete color."
            );
        }

        await loadColors();

    } catch (error) {

        console.error(error);

        alert(error.message);
    }
}


/* =========================
   CLOSE MODAL
========================= */

function closeModal() {

    document
        .getElementById("modalOverlay")
        .classList.remove("active");
}


/* =========================
   CLICK OUTSIDE MODAL
========================= */

document
    .getElementById("modalOverlay")
    .addEventListener(
        "click",
        event => {

            if (
                event.target.id ===
                "modalOverlay"
            ) {
                closeModal();
            }
        }
    );


/* =========================
   ESCAPE
========================= */

document.addEventListener(
    "keydown",
    event => {

        if (event.key === "Escape") {
            closeModal();
        }
    }
);


/* =========================
   HTML ESCAPE
========================= */

function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll(
            "'",
            "&#039;"
        );
}


/* =========================
   INITIAL LOAD
========================= */

loadColors();

</script>

</body>
</html>
